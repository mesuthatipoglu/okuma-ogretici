<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Book -->
  <rect x="130" y="150" width="252" height="220" rx="16" fill="white" opacity="0.95"/>
  <line x1="256" y1="160" x2="256" y2="360" stroke="#e0e0e0" stroke-width="2"/>
  <!-- Letter A on left page -->
  <text x="190" y="290" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="80" fill="#E53935">A</text>
  <!-- Letter B on right page -->
  <text x="320" y="290" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="80" fill="#1E88E5">B</text>
  <!-- Eyes on A -->
  <circle cx="175" cy="230" r="6" fill="#333"/>
  <circle cx="205" cy="230" r="6" fill="#333"/>
  <circle cx="177" cy="228" r="2" fill="white"/>
  <circle cx="207" cy="228" r="2" fill="white"/>
  <!-- Smile on A -->
  <path d="M 178 305 Q 190 318 202 305" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <!-- Eyes on B -->
  <circle cx="305" cy="230" r="6" fill="#333"/>
  <circle cx="335" cy="230" r="6" fill="#333"/>
  <circle cx="307" cy="228" r="2" fill="white"/>
  <circle cx="337" cy="228" r="2" fill="white"/>
  <!-- Smile on B -->
  <path d="M 308 305 Q 320 318 332 305" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <!-- Stars -->
  <text x="256" y="120" text-anchor="middle" font-size="60">📚</text>
  <text x="100" y="100" text-anchor="middle" font-size="36">⭐</text>
  <text x="412" y="100" text-anchor="middle" font-size="36">⭐</text>
  <text x="140" y="430" text-anchor="middle" font-size="28">✨</text>
  <text x="372" y="430" text-anchor="middle" font-size="28">✨</text>
</svg>
